server:
  port: ${PORT:8090}
spring:
  application:
    name: rooms-api
  datasource:
    url: jdbc:sqlite:${DB_PATH:nordia.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys = ON
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

app:
  timezone: Europe/Oslo
  security:
    users:
      - username: alice
        password: ${ALICE_PASSWORD:alice-pass}
        roles: [USER]
      - username: bob
        password: ${BOB_PASSWORD:bob-pass}
        roles: [USER]
      - username: admin
        password: ${ADMIN_PASSWORD:admin-pass}
        roles: [ADMIN]

springdoc:
  swagger-ui:
    path: /swagger-ui.html